<title>The Pour List — Tatler Best 20 Bars PH 2026</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
  :root{
    --ink:#17121B;
    --surface:#221A27;
    --surface-2:#2C2233;
    --line:#3A2E42;
    --brass:#E0A040;
    --menthe:#7FB6A9;
    --bone:#F0E8DC;
    --dim:#9C8FA6;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:rgba(224,160,64,.18);
  }

  /* Safari on iOS needs the -webkit fallback before dvh */
  #app{
    display:flex;flex-direction:column;
    height:100vh;
    height:-webkit-fill-available;
    height:100dvh;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  /* Momentum scrolling everywhere that scrolls */
  .list,.detail,.shelf,.filters.types,.shots{-webkit-overflow-scrolling:touch}

  /* ---------- Header ---------- */
  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#1E1723 0%,var(--ink) 100%);
    padding:calc(14px + env(safe-area-inset-top)) 20px 10px;
    flex:0 0 auto;
  }
  .head-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;font-size:30px;letter-spacing:.01em;line-height:1;
  }
  h1 em{font-style:italic;color:var(--brass)}
  .sub{
    font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  }
  .tab-count{
    margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:.1em;color:var(--dim);white-space:nowrap;
  }
  .tab-count b{color:var(--brass);font-size:15px}

  /* ---------- Signature: the shelf of 20 glasses ---------- */
  .shelf{
    display:flex;gap:5px;margin-top:11px;padding-bottom:7px;
    border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  }
  .shelf::-webkit-scrollbar{display:none}
  .glass{
    flex:0 0 auto;width:15px;height:22px;cursor:pointer;
    background:none;border:0;padding:0;opacity:.5;transition:opacity .18s,transform .18s;
  }
  .glass:hover{opacity:1;transform:translateY(-2px)}
  .glass:focus-visible{outline:2px solid var(--brass);outline-offset:2px;opacity:1}
  .glass.on{opacity:1}
  .glass svg{display:block;width:100%;height:100%}

  /* ---------- Filters ---------- */
  .filters{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .chip{
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.09em;
    text-transform:uppercase;padding:5px 11px;border-radius:100px;
    border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;
    transition:.15s;
  }
  .chip:hover{border-color:var(--brass);color:var(--bone)}
  .chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#241A0C;font-weight:700}
  .chip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* ---------- Body split ---------- */
  .split{display:flex;flex:1 1 auto;min-height:0}
  #map{flex:1 1 auto;background:#12101A}
  .leaflet-container{background:#12101A;font-family:'Archivo',sans-serif}
  .leaflet-control-attribution{
    background:rgba(23,18,27,.86)!important;color:var(--dim)!important;font-size:9px!important;
  }
  .leaflet-control-attribution a{color:var(--menthe)!important}
  .leaflet-bar a{background:var(--surface)!important;color:var(--bone)!important;border-color:var(--line)!important}
  .leaflet-bar a:hover{background:var(--surface-2)!important}

  /* ---------- Panel ---------- */
  aside{
    flex:0 0 372px;border-left:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column;min-height:0;
  }

  .list{overflow-y:auto;flex:1 1 auto}
  .row{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:11px 16px;background:none;border:0;border-bottom:1px solid var(--line);
    color:inherit;cursor:pointer;font-family:inherit;transition:background .13s;
  }
  .row:hover{background:var(--surface-2)}
  .row:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
  .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#D3C7DE;opacity:.9}
  .dot.poured{background:var(--brass);opacity:1}
  .dot.listed{background:transparent;opacity:1;border:2px solid var(--menthe)}
  .row-name{font-size:14.5px;font-weight:500;line-height:1.25}
  .row-meta{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);margin-top:2px}
  .row-rate{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--brass);white-space:nowrap}

  /* ---------- Detail ---------- */
  .detail{overflow-y:auto;flex:1 1 auto;display:none}
  .detail.show{display:block}
  .list.hide{display:none}

  .back{
    position:sticky;top:0;z-index:5;width:100%;text-align:left;
    background:var(--surface);border:0;border-bottom:1px solid var(--line);
    padding:11px 16px;color:var(--dim);cursor:pointer;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  }
  .back:hover{color:var(--brass)}
  .back:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

  .d-pad{padding:18px 20px 30px}
  .d-name{font-family:'Instrument Serif',serif;font-size:31px;line-height:1.05;margin-bottom:6px}
  .d-line{
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--dim);display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  }
  .d-line .rate{color:var(--brass)}

  .tags{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0 0}
  .tag{
    font-size:10.5px;letter-spacing:.04em;padding:3px 9px;border-radius:100px;
    border:1px solid var(--line);color:var(--menthe);
  }

  .d-vibe{font-size:14px;line-height:1.55;color:#DCD2C6;margin-top:14px}

  /* status toggle */
  .status{display:flex;gap:7px;margin:18px 0 4px}
  .st{
    flex:1;padding:9px 6px;border-radius:3px;border:1px solid var(--line);
    background:transparent;color:var(--dim);cursor:pointer;
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    transition:.15s;
  }
  .st:hover{color:var(--bone);border-color:var(--dim)}
  .st:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .st.on-poured{background:var(--brass);border-color:var(--brass);color:#241A0C;font-weight:700}
  .st.on-listed{background:transparent;border-color:var(--menthe);color:var(--menthe);font-weight:700}

  /* section blocks */
  .sec{margin-top:24px}
  .sec-h{
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--brass);padding-bottom:7px;
    border-bottom:1px solid var(--line);margin-bottom:11px;
  }

  /* menu leader dots */
  .order{display:flex;align-items:baseline;gap:6px;padding:5px 0;font-size:13.5px}
  .order .n{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--dim);flex:0 0 16px}
  .order .lead{flex:1 1 auto;border-bottom:1px dotted var(--line);transform:translateY(-3px)}

  .kv{display:flex;gap:12px;padding:6px 0;font-size:13px;line-height:1.45}
  .kv .k{
    flex:0 0 74px;font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding-top:3px;
  }
  .kv .v{flex:1 1 auto;color:#DCD2C6}
  .kv .v a{color:var(--menthe);text-decoration:none;border-bottom:1px solid transparent}
  .kv .v a:hover{border-bottom-color:var(--menthe)}

  .hours{font-family:'Space Mono',monospace;font-size:11px;line-height:1.85;color:#C9BEB4}
  .hours .closed{color:#7A6E82}
  .hours .today{color:var(--brass)}

  .note{
    margin-top:22px;padding:11px 13px;border-left:2px solid var(--line);
    font-size:11.5px;line-height:1.5;color:var(--dim);
  }

  .empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}

  /* ---------- Fallback backdrop (when tiles are blocked) ---------- */
  .leaflet-container.no-tiles{
    background-color:#12101A;
    background-image:
      linear-gradient(rgba(58,46,66,.42) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,46,66,.42) 1px, transparent 1px),
      linear-gradient(rgba(58,46,66,.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,46,66,.2) 1px, transparent 1px);
    background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  }
  .district{
    font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:#6E6376;white-space:nowrap;pointer-events:none;
  }
  .notice{
    position:absolute;left:10px;bottom:10px;z-index:600;max-width:270px;
    background:rgba(34,26,39,.94);border:1px solid var(--line);border-left:2px solid var(--brass);
    padding:9px 11px;font-size:11px;line-height:1.5;color:var(--dim);border-radius:2px;
  }
  .notice b{color:var(--bone);font-weight:500}
  .leaflet-control-scale-line{
    background:rgba(34,26,39,.85)!important;border-color:var(--line)!important;
    color:var(--dim)!important;font-family:'Space Mono',monospace!important;font-size:9px!important;
  }

  .filters.types{
    flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;
  }
  .filters.types::-webkit-scrollbar{display:none}
  .chip.type{border-style:dashed;color:var(--menthe);border-color:#3F4F4C}
  .chip.type:hover{border-color:var(--menthe);color:var(--bone)}
  .chip.type[aria-pressed="true"]{
    background:var(--menthe);border-color:var(--menthe);border-style:solid;
    color:#12211E;font-weight:700;
  }
  .chip .n{opacity:.6;margin-left:4px}

  .row-kind{
    display:block;font-size:11px;line-height:1.3;color:var(--menthe);
    margin-top:2px;letter-spacing:.01em;
  }

  .kinds{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 0}
  .kind{
    font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.09em;
    text-transform:uppercase;padding:4px 9px;border-radius:2px;
    background:rgba(127,182,169,.13);border:1px solid #3F4F4C;color:var(--menthe);
  }

  /* ---------- Photos ---------- */
  .shots{
    display:flex;gap:6px;overflow-x:auto;padding:0 0 3px;margin-bottom:16px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .shots::-webkit-scrollbar{height:5px}
  .shots::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  .shot{
    flex:0 0 auto;width:132px;height:176px;border-radius:2px;overflow:hidden;
    background:var(--surface-2);border:1px solid var(--line);position:relative;
  }
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .ph{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-family:'Instrument Serif',serif;font-size:34px;color:#4B3F55;
  }
  .shot.failed img{display:none}
  .shot.failed .ph{display:flex}

  .thumb{
    flex:0 0 auto;width:40px;height:40px;border-radius:2px;overflow:hidden;
    background:var(--surface-2);border:1px solid var(--line);position:relative;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-family:'Instrument Serif',serif;font-size:16px;color:#4B3F55;
  }
  .thumb.failed img{display:none}
  .thumb.failed .ph{display:flex}

  .credit{
    font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;
    text-transform:uppercase;color:#5F5568;margin:-11px 0 16px;
  }

  /* OSM tiles ship light; invert + rotate hue to sit in the dark theme */
  .leaflet-tile-pane{
    filter:invert(1) hue-rotate(180deg) brightness(.78) contrast(1.05) saturate(.55);
  }

  /* ---------- Marker ---------- */
  .pin{
    width:15px;height:15px;border-radius:50%;
    background:#D3C7DE;border:2px solid #17121B;
    box-shadow:0 0 0 1px #D3C7DE;transition:transform .15s;
  }
  .pin.poured{background:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 13px rgba(224,160,64,.6)}
  .pin.listed{background:transparent;border-color:var(--menthe);box-shadow:0 0 0 1px rgba(127,182,169,.5)}
  .pin.active{transform:scale(1.55)}

  .leaflet-popup-content-wrapper{
    background:var(--surface-2);color:var(--bone);border-radius:3px;border:1px solid var(--line);
  }
  .leaflet-popup-tip{background:var(--surface-2);border:1px solid var(--line)}
  .leaflet-popup-content{margin:9px 13px;font-size:13px}
  .pop-n{font-family:'Instrument Serif',serif;font-size:17px;line-height:1.15}
  .pop-m{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);margin-top:3px}

  footer{
    flex:0 0 auto;border-top:1px solid var(--line);
    padding:7px 20px calc(7px + env(safe-area-inset-bottom));
    font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;color:#6E6376;
  }
  footer a{color:#6E6376}

  /* ---------- Mobile toggle (hidden on desktop) ---------- */
  .mtabs{display:none;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .mtab{
    flex:1;padding:9px 6px;background:transparent;border:0;color:var(--dim);cursor:pointer;
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  }
  .mtab[aria-pressed="true"]{background:var(--surface-2);color:var(--bone);font-weight:700}
  .mtab:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    header{padding-left:16px;padding-right:16px}
    h1{font-size:23px}
    .sub{font-size:9.5px}
    .tab-count{margin-left:auto}
    .mtabs{display:flex}

    /* Bigger targets: Apple's floor is 44px */
    .glass{width:20px;height:30px;padding:4px 0}
    .shelf{gap:3px;margin-top:9px}
    .chip{padding:8px 13px;font-size:10.5px}
    .row{padding:13px 16px;min-height:60px}
    .st{padding:13px 6px}
    .back{padding:14px 16px}
    .kind{padding:7px 11px}

    .split{flex-direction:column;position:relative}
    #map,aside{width:100%}
    #map{flex:1 1 auto;min-height:0}
    aside{flex:1 1 auto;border-left:0;border-top:1px solid var(--line);min-height:0}

    /* One pane at a time */
    body.v-map aside{display:none}
    body.v-list #map{display:none}

    .shot{width:118px;height:158px}
    .notice{max-width:calc(100% - 20px);font-size:10.5px}
  }

  @media (max-width:420px){
    h1{font-size:21px}
    .sub{display:none}
    .d-name{font-size:26px}
  }

  /* Touch devices get press feedback instead of hover */
  @media (hover:none){
    .row:hover{background:none}
    .row:active{background:var(--surface-2)}
    .chip:active,.st:active,.mtab:active{opacity:.65}
    .glass:hover{transform:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

<div id="app">
  <header>
    <div class="head-row">
      <h1>The <em>Pour</em> List</h1>
      <span class="sub">Tatler Best 20 Bars · Philippines 2026</span>
      <span class="tab-count"><b id="cnt">0</b> / 20 poured</span>
    </div>
    <div class="shelf" id="shelf" role="group" aria-label="Jump to a bar"></div>
    <div class="filters" role="group" aria-label="Filter by status">
      <button class="chip" data-f="all" aria-pressed="true">All 20</button>
      <button class="chip" data-f="poured" aria-pressed="false">Poured</button>
      <button class="chip" data-f="listed" aria-pressed="false">On the list</button>
      <button class="chip" data-f="none" aria-pressed="false">Unmarked</button>
    </div>
    <div class="filters types" id="types" role="group" aria-label="Filter by type of bar"></div>
    <div class="mtabs" role="group" aria-label="Switch view">
      <button class="mtab" data-v="map" aria-pressed="true">Map</button>
      <button class="mtab" data-v="list" aria-pressed="false">Directory</button>
    </div>
  </header>

  <div class="split">
    <div id="map"></div>
    <aside>
      <div class="list" id="list"></div>
      <div class="detail" id="detail"></div>
    </aside>
  </div>

  <footer>
    List: Tatler Philippines · Ratings &amp; hours: Google · Map: <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> / CARTO
  </footer>
</div>

  "Raion":["Cocktail bar","Café by day","Neighbourhood"],
  "Recraft":["Cocktail bar","Whisky bar","Neighbourhood","Food-forward"],
  "Run Rabbit Run":["Cocktail bar","Café by day"],
  "Skybar":["Rooftop","Party bar","Live music"],
  "Southbank Café + Lounge":["Café by day","Cocktail bar","Food-forward"],
  "The Spirits Library":["Cocktail bar","Whisky bar","Live music"],
};
BARS.forEach(b => b.kind = KIND[b.name] || []);

/* ============================================================
   STATE — held in memory for this session only.
   ============================================================ */
const status = new Array(BARS.length).fill(null);
let filter = "all";
let typeFilter = null;   // null = any type
let openIdx = null;

const listEl   = document.getElementById('list');
const detailEl = document.getElementById('detail');
const shelfEl  = document.getElementById('shelf');
const typesEl  = document.getElementById('types');
const cntEl    = document.getElementById('cnt');

/* ---------- Map ---------- */
const map = L.map('map',{zoomControl:true,attributionControl:true}).setView([14.5680,121.0290],12);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);

/* Street tiles need an outside server. Some sandboxes block it, so if the
   tiles fail we fall back to a plain positional backdrop instead of a void. */
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors', maxZoom:19
}).addTo(map);

const DISTRICTS = [
  ["Quezon City",      14.6480, 121.0250],
  ["Vertis North",     14.6530, 121.0351],
  ["Marikina",         14.6470, 121.1043],
  ["San Juan",         14.6030, 121.0330],
  ["Mandaluyong",      14.5930, 121.0412],
  ["Poblacion",        14.5700, 121.0306],
  ["Salcedo Village",  14.5645, 121.0210],
  ["Legazpi Village",  14.5590, 121.0130],
  ["BGC",              14.5560, 121.0540],
  ["Manila Bay →",     14.5400, 120.9700]
];

let fellBack = false, tileErrors = 0;

function useFallback(){
  if(fellBack) return;
  fellBack = true;
  map.removeLayer(tiles);
  map.getContainer().classList.add('no-tiles');

  DISTRICTS.forEach(([name,lat,lng])=>{
    L.marker([lat,lng],{
      interactive:false, keyboard:false,
      icon:L.divIcon({className:'',html:`<div class="district">${name}</div>`,iconSize:[0,0]})
    }).addTo(map);
  });

  const n = document.createElement('div');
  n.className = 'notice';
  n.innerHTML = '<b>Street map unavailable here.</b> This preview blocks the tile server, so pins are shown by position only. Download the file and open it in your browser for the full map.';
  document.getElementById('map').appendChild(n);
}

tiles.on('tileerror', ()=>{ if(++tileErrors >= 3) useFallback(); });
// If nothing has loaded after a few seconds, assume the tiles are blocked.
let loadedOne = false;
tiles.on('tileload', ()=>{ loadedOne = true; });
setTimeout(()=>{ if(!loadedOne) useFallback(); }, 4000);

const markers = BARS.map((b,i)=>{
  const m = L.marker([b.lat,b.lng],{
    icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[15,15],iconAnchor:[7,7]}),
    title:b.name, keyboard:true, alt:b.name
  }).addTo(map);
  m.bindPopup(`<div class="pop-n">${b.name}</div><div class="pop-m">${b.area} · ★ ${b.rating}</div>`);
  m.on('click',()=>openDetail(i));
  return m;
});

/* ---------- Rendering ---------- */
const GLASS = `<svg viewBox="0 0 15 22" aria-hidden="true"><path d="M2 2h11l-4 8v8h3v2H3v-2h3v-8L2 2z" fill="FILL" stroke="STROKE" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

function glassSvg(st){
  if(st==='poured') return GLASS.replace('FILL','#E0A040').replace('STROKE','#E0A040');
  if(st==='listed') return GLASS.replace('FILL','none').replace('STROKE','#7FB6A9');
  return GLASS.replace('FILL','none').replace('STROKE','#D3C7DE');
}

function renderShelf(){
  shelfEl.innerHTML = '';
  BARS.forEach((b,i)=>{
    const btn = document.createElement('button');
    btn.className = 'glass' + (status[i] ? ' on' : '');
    btn.innerHTML = glassSvg(status[i]);
    btn.title = b.name;
    btn.setAttribute('aria-label', b.name + (status[i] ? ' — ' + (status[i]==='poured'?'poured':'on the list') : ''));
    btn.onclick = ()=>openDetail(i);
    shelfEl.appendChild(btn);
  });
  cntEl.textContent = status.filter(s=>s==='poured').length;
}

function passes(i){
  if(typeFilter && !BARS[i].kind.includes(typeFilter)) return false;
  if(filter==='all') return true;
  if(filter==='none') return status[i]===null;
  return status[i]===filter;
}

/* Type chips build themselves from the data, most common first. */
function renderTypes(){
  const tally = {};
  BARS.forEach(b => b.kind.forEach(k => tally[k] = (tally[k]||0)+1));
  const kinds = Object.keys(tally).sort((a,b)=> tally[b]-tally[a] || a.localeCompare(b));

  typesEl.innerHTML = '';

  const any = document.createElement('button');
  any.className = 'chip type';
  any.textContent = 'Any type';
  any.setAttribute('aria-pressed', String(typeFilter===null));
  any.onclick = ()=>{ typeFilter = null; closeDetail(); renderAll(); };
  typesEl.appendChild(any);

  kinds.forEach(k=>{
    const c = document.createElement('button');
    c.className = 'chip type';
    c.innerHTML = `${k}<span class="n">${tally[k]}</span>`;
    c.setAttribute('aria-pressed', String(typeFilter===k));
    c.onclick = ()=>{ typeFilter = (typeFilter===k) ? null : k; closeDetail(); renderAll(); };
    typesEl.appendChild(c);
  });
}

function renderList(){
  listEl.innerHTML = '';
  const shown = BARS.map((b,i)=>i).filter(passes);

  if(!shown.length){
    listEl.innerHTML = typeFilter
      ? `<div class="empty">No ${typeFilter.toLowerCase()} matches that status.<br>Try another type or clear the filter.</div>`
      : '<div class="empty">Nothing here yet.<br>Open a bar and mark it to fill this list.</div>';
    return;
  }

  shown.forEach(i=>{
    const b = BARS[i];
    const st = status[i];
    const row = document.createElement('button');
    row.className = 'row';
    const ini = b.name.replace(/^The /,'').charAt(0);
    const thumb = b.pics.length
      ? `<span class="thumb"><img src="${b.pics[0]}" alt="" loading="lazy"
           onerror="this.parentNode.classList.add('failed')"><span class="ph">${ini}</span></span>`
      : `<span class="thumb failed"><span class="ph">${ini}</span></span>`;
    row.innerHTML =
      `<span class="dot ${st||''}"></span>
       ${thumb}
       <span>
         <span class="row-name">${b.name}</span>
         <span class="row-kind">${b.kind.join(' · ')}</span>
         <span class="row-meta">${b.area}</span>
       </span>
       <span class="row-rate">★ ${b.rating}</span>`;
    row.onclick = ()=>openDetail(i);
    listEl.appendChild(row);
  });
}

function renderMarkers(){
  markers.forEach((m,i)=>{
    const el = m.getElement()?.querySelector('.pin');
    if(!el) return;
    el.className = 'pin' + (status[i] ? ' ' + status[i] : '') + (openIdx===i ? ' active' : '');
    const vis = passes(i);
    m.getElement().style.display = vis ? '' : 'none';
  });
}

function renderAll(){ renderShelf(); renderTypes(); renderList(); renderMarkers(); }

/* ---------- Detail view ---------- */
function openDetail(i){
  openIdx = i;
  const b = BARS[i];
  const todayIdx = (new Date().getDay() + 6) % 7; // Mon = 0

  const orders = b.orders.map((o,n)=>
    `<div class="order"><span class="n">${String(n+1).padStart(2,'0')}</span><span>${o}</span><span class="lead"></span></div>`
  ).join('');

  const hours = b.hours.filter(Boolean).map((h,n)=>{
    const closed = /closed/i.test(h);
    const today  = b.hours.length===7 && n===todayIdx;
    return `<div class="${closed?'closed':(today?'today':'')}">${h}${today?'  ←':''}</div>`;
  }).join('');

  const contact = [];
  if(b.phone) contact.push(`<div class="kv"><span class="k">Phone</span><span class="v"><a href="tel:${b.phone.replace(/\s/g,'')}">${b.phone}</a></span></div>`);
  if(b.ig)    contact.push(`<div class="kv"><span class="k">Instagram</span><span class="v"><a href="${b.ig}" target="_blank" rel="noopener">Open profile ↗</a></span></div>`);
  if(b.web)   contact.push(`<div class="kv"><span class="k">Website</span><span class="v"><a href="${b.web}" target="_blank" rel="noopener">Open site ↗</a></span></div>`);

  const initial = b.name.replace(/^The /,'').charAt(0);
  const shots = b.pics.length ? `<div class="shots">` + b.pics.map(u=>
      `<div class="shot"><img src="${u}" alt="${b.name}" loading="lazy"
         onerror="this.parentNode.classList.add('failed')"><span class="ph">${initial}</span></div>`
    ).join('') + `</div><div class="credit">Photos: Tatler Philippines</div>` : '';

  detailEl.innerHTML = `
    <button class="back" id="back">← All bars</button>
    <div class="d-pad">
      ${shots}
      <div class="d-name">${b.name}</div>
      <div class="d-line">
        <span>${b.area}</span><span>·</span>
        <span class="rate">★ ${b.rating} <span style="color:var(--dim)">(${b.count})</span></span>
      </div>
      <div class="kinds">${b.kind.map(k=>`<button class="kind" data-kind="${k}">${k}</button>`).join('')}</div>
      <div class="tags">${b.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <p class="d-vibe">${b.vibe}</p>

      <div class="status">
        <button class="st ${status[i]==='poured'?'on-poured':''}" data-set="poured">Poured</button>
        <button class="st ${status[i]==='listed'?'on-listed':''}" data-set="listed">On the list</button>
      </div>

      <div class="sec">
        <div class="sec-h">Order these five</div>
        ${orders}
      </div>

      <div class="sec">
        <div class="sec-h">Hours</div>
        <div class="hours">${hours}</div>
      </div>

      <div class="sec">
        <div class="sec-h">Details</div>
        <div class="kv"><span class="k">Address</span><span class="v">${b.addr}</span></div>
        <div class="kv"><span class="k">Typical</span><span class="v">${b.price}</span></div>
        <div class="kv"><span class="k">Awards</span><span class="v">${b.award}</span></div>
        ${contact.join('')}
      </div>

      <div class="note">
        Menu prices shown are typical per-drink estimates. Most venues add roughly 22–24% on the bill for service charge and VAT.
      </div>
    </div>`;

  detailEl.querySelector('#back').onclick = closeDetail;
  detailEl.querySelectorAll('.kind').forEach(k=>{
    k.style.cursor = 'pointer';
    k.title = 'Show only ' + k.dataset.kind;
    k.onclick = ()=>{ typeFilter = k.dataset.kind; closeDetail(); renderAll(); };
  });
  detailEl.querySelectorAll('.st').forEach(btn=>{
    btn.onclick = ()=>{
      const want = btn.dataset.set;
      status[i] = (status[i]===want) ? null : want;
      openDetail(i);          // repaint the toggle
      renderAll();
    };
  });

  listEl.classList.add('hide');
  detailEl.classList.add('show');
  detailEl.scrollTop = 0;

  // On a phone the map and directory don't share the screen, so bring the
  // details into view when a pin is tapped.
  if(isPhone()) setView('list');

  map.flyTo([b.lat,b.lng], Math.max(map.getZoom(),15), {duration:.6});
  markers[i].openPopup();
  renderMarkers();
}

function closeDetail(){
  openIdx = null;
  detailEl.classList.remove('show');
  listEl.classList.remove('hide');
  map.closePopup();
  renderMarkers();
}

/* ---------- Filters ---------- */
document.querySelectorAll('.filters:not(.types) .chip').forEach(chip=>{
  chip.onclick = ()=>{
    filter = chip.dataset.f;
    document.querySelectorAll('.filters:not(.types) .chip')
      .forEach(c=>c.setAttribute('aria-pressed', String(c===chip)));
    closeDetail();
    renderAll();
  };
});

/* ---------- Mobile view switching ---------- */
const isPhone = ()=> window.matchMedia('(max-width:820px)').matches;

function setView(v){
  document.body.classList.toggle('v-map',  v==='map');
  document.body.classList.toggle('v-list', v==='list');
  document.querySelectorAll('.mtab').forEach(t=>
    t.setAttribute('aria-pressed', String(t.dataset.v===v)));
  if(v==='map') setTimeout(()=>map.invalidateSize(), 60);
}

document.querySelectorAll('.mtab').forEach(t=>{
  t.onclick = ()=> setView(t.dataset.v);
});

setView('map');

/* Leaflet needs a nudge whenever its box changes size — rotation, or Safari's
   address bar collapsing as you scroll. */
let rsz;
function nudge(){ clearTimeout(rsz); rsz = setTimeout(()=>map.invalidateSize(), 180); }
window.addEventListener('resize', nudge);
window.addEventListener('orientationchange', nudge);
if(window.visualViewport) window.visualViewport.addEventListener('resize', nudge);

renderAll();
</script>
